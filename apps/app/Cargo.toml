[package]
name = "rusty-duck"
version = "1.0.0"
edition = "2024"

[lib]
name = "rusty_duck"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
form_urlencoded = "1.2.2"
fst = "0.4.7"
worker = "0.9.0"
urlencoding = "2.1.3"

[dev-dependencies]
divan = "0.1.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
fst = "0.4.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bench]]
name = "bang-find"
harness = false
